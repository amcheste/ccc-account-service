# Local development overlay for kind (make kind-up / kind-deploy).
# This is the one overlay allowed in the public repo because it targets
# a throwaway local cluster, not the real one; cluster state for the
# homelab stays in the private ccc-deploy repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ccc

resources:
  - namespace.yaml
  - ../base

images:
  - name: ghcr.io/amcheste/ccc-account-service
    newTag: dev

patches:
  # One replica is plenty for a laptop smoke test.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: account-service
  # Wire the throwaway postgres from the ccc-dev stack. The secret is
  # generated at runtime by ccc-dev's up.sh, never committed anywhere.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: CCC_DB_HOST
            value: postgres
          - name: CCC_DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: username
          - name: CCC_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: password
          - name: CCC_HTTP_BASE_PATH
            value: /api/account
          # The ccc-dev stack serves plain http; localhost is a secure
          # context so this stays true-by-default in the homelab only.
          - name: CCC_COOKIE_SECURE
            value: "false"
          - name: CCC_JWT_SIGNING_KEY
            valueFrom:
              secretKeyRef:
                name: account-service-keys
                key: jwt-signing-seed
          - name: CCC_BOOTSTRAP_ADMIN
            value: alan
          - name: CCC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: account-service-keys
                key: bootstrap-admin-password
    target:
      kind: Deployment
      name: account-service
